<div class="ws-create">
    <div class="ws-create__header">
        <button class="back-btn" (click)="goBack()" aria-label="Back to dashboard">
            <svg viewBox="0 0 20 20" fill="currentColor" width="20" height="20">
                <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
            </svg>
        </button>
        <div class="ws-create__title-group">
            <h1>Create Workspace</h1>
            <p>Configure your new database workspace</p>
        </div>
    </div>

    <div class="ws-create__card">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="ws-create__form">

            <!-- Workspace Name -->
            <div class="field">
                <label for="name">Workspace Name</label>
                <div class="input-wrap" [class.input-wrap--invalid]="isInvalid('name')">
                    <input id="name" type="text" formControlName="name" placeholder="e.g., SalesDB_2026" autocomplete="off" />
                </div>
                @if (isInvalid('name')) {
                <small class="field-error">Workspace name is required</small>
                }
            </div>

            <!-- API Key -->
            <div class="field">
                <label for="apiKey">API Key</label>
                <div class="api-key-row">
                    <div class="input-wrap input-wrap--readonly">
                        <input id="apiKey" type="text" formControlName="apiKey" [disabled]="true" readonly />
                    </div>
                    <button type="button" class="refresh-btn" (click)="regenerateApiKey()" aria-label="Generate new API key">
                        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                            <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
                        </svg>
                        Regenerate
                    </button>
                </div>
            </div>

            <!-- Database Credentials -->
            <div class="field-row">
                <div class="field">
                    <label for="dbUserName">Database Username</label>
                    <div class="input-wrap" [class.input-wrap--invalid]="isInvalid('dbUserName')">
                        <input id="dbUserName" type="text" formControlName="dbUserName" placeholder="e.g., sa" autocomplete="off" />
                    </div>
                    @if (isInvalid('dbUserName')) {
                    <small class="field-error">Username is required</small>
                    }
                </div>

                <div class="field">
                    <label for="dbPassword">Database Password</label>
                    <div class="input-wrap" [class.input-wrap--invalid]="isInvalid('dbPassword')">
                        <input id="dbPassword" type="password" formControlName="dbPassword" placeholder="Enter password" autocomplete="off" />
                    </div>
                    @if (isInvalid('dbPassword')) {
                    <small class="field-error">Password is required</small>
                    }
                </div>
            </div>

            <!-- Active Toggle -->
            <label class="toggle-row" for="isActive">
                <div class="toggle">
                    <input id="isActive" type="checkbox" formControlName="isActive" />
                    <span class="toggle__slider"></span>
                </div>
                <div class="toggle__label">
                    <span class="toggle__title">Active Workspace</span>
                    <span class="toggle__desc">Enable this workspace for API operations</span>
                </div>
            </label>

            <!-- Actions -->
            <div class="ws-create__actions">
                <button type="button" class="btn btn--secondary" (click)="goBack()">Cancel</button>
                <button type="submit" class="btn btn--primary" [disabled]="form.invalid || isSubmitting()">
                    @if (isSubmitting()) {
                    <svg class="spinner" viewBox="0 0 24 24" width="18" height="18">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="31.4 31.4" />
                    </svg>
                    Creating…
                    } @else {
                    <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                    </svg>
                    Create Workspace
                    }
                </button>
            </div>
        </form>
    </div>
</div>
