<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — APIEngine</title>
<link rel="stylesheet" href="shared-styles.css">
<style>
  body { background: var(--gray-50); min-height: 100vh; display: flex; flex-direction: column; }
  .auth-nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 48px; }
  .logo { font-size: 22px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  .logo span { color: var(--gray-900); }
  .logo svg { width: 28px; height: 28px; }
  .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .auth-card { background: #fff; border: 1px solid var(--gray-200); border-radius: 16px; padding: 40px; width: 100%; max-width: 440px; box-shadow: var(--shadow-md); }
  .auth-card h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .auth-card .subtitle { color: var(--gray-500); font-size: 15px; margin-bottom: 28px; }
  .auth-card .subtitle a { color: var(--primary); font-weight: 600; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 14px; font-weight: 600; color: var(--gray-700); margin-bottom: 6px; }
  .form-group input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--gray-200); border-radius: 8px; font-size: 15px; font-family: var(--font); transition: border-color .15s; background: var(--gray-50); }
  .form-group input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
  .form-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .form-row label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--gray-600); cursor: pointer; }
  .form-row a { font-size: 13px; color: var(--primary); font-weight: 600; }
  .btn-submit { width: 100%; padding: 12px; font-size: 15px; }
  .divider { display: flex; align-items: center; gap: 16px; margin: 24px 0; color: var(--gray-400); font-size: 13px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--gray-200); }
  .social-btns { display: flex; gap: 12px; }
  .social-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border: 1.5px solid var(--gray-200); border-radius: 8px; background: #fff; font-size: 14px; font-weight: 500; color: var(--gray-700); cursor: pointer; transition: all .15s; }
  .social-btn:hover { border-color: var(--gray-300); background: var(--gray-50); }
  .social-btn svg { width: 18px; height: 18px; }
</style>
</head>
<body>

<div class="auth-nav">
  <a href="landing.html" class="logo">
    <svg viewBox="0 0 32 32" fill="none"><rect x="2" y="6" width="28" height="20" rx="4" stroke="#4f46e5" stroke-width="2.5"/><path d="M9 16h6m-3-3v6" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/><circle cx="22" cy="16" r="3" stroke="#7c3aed" stroke-width="2"/></svg>
    API<span>Engine</span>
  </a>
  <a href="register.html" class="btn btn-outline btn-sm">Create Account</a>
</div>

<div class="auth-container">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Don't have an account? <a href="register.html">Start free trial</a></p>

    <div class="social-btns">
      <button class="social-btn">
        <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Google
      </button>
      <button class="social-btn">
        <svg viewBox="0 0 24 24" fill="#333"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        GitHub
      </button>
    </div>

    <div class="divider">or continue with email</div>

    <form onsubmit="window.location.href='dashboard.html'; return false;">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" placeholder="you@company.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="••••••••" required>
      </div>
      <div class="form-row">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-submit">Sign in</button>
    </form>
  </div>
</div>

</body>
</html>
